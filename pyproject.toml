[project]
name = "fuel-route-optimizer"
version = "0.1.0"
description = "Django API that plans the cheapest fuel stops along a US driving route."
requires-python = ">=3.13"
dependencies = [
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
